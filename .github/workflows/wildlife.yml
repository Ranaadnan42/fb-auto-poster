name: Wild Nations (Wildlife Agent)
run-name: ${{ github.workflow }} [${{ inputs.sched || github.event.schedule || 'manual' }}]

on:
  schedule:
    # Waqt UTC. Agent pehle chal kar video banata hai, POST_AT par post (slot_wait). USA/UK/Europe audience.
    - cron: '7 12 * * *'    # reel - post 13:37 UTC = 8:37 subah New York / 1:37 London
    - cron: '52 10 * * *'   # pic - ultra-HD tasveer + photo story, post 11:07 UTC
    - cron: '52 16 * * *'   # pic - ultra-HD tasveer + photo story, post 17:07 UTC
    - cron: '37 18 * * *'   # reel - post 20:07 UTC = 3:07 sehpehar New York / 8:07 shaam London
    - cron: '47 20 * * *'   # long - post 23:47 UTC = 6:47 shaam New York (Wildlife of <mulk>)
  workflow_dispatch:
    inputs:
      sched:
        description: 'Scheduler ke liye - khali chhor dein'
        type: string
        default: ''
      mode:
        description: 'Kya banaye'
        type: choice
        options: [reel, long, pic]
        default: reel
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: wild-${{ (inputs.sched || github.event.schedule) || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: g
        name: Double post check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: wildlife.yml
          SCHED: ${{ inputs.sched || github.event.schedule }}
        run: python3 tools/slot_gate.py

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      S: ${{ inputs.sched || github.event.schedule }}
    steps:
      - name: Job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-dejavu-core && break
            echo "apt koshish $i fail - 30s baad dobara"; sleep 30
          done
          command -v ffmpeg
          pip install requests pillow "edge-tts>=7.3.0"
      - name: Run wildlife agent
        env:
          WILD_PAGE_ID: ${{ secrets.WILD_PAGE_ID }}
          WILD_PAGE_TOKEN: ${{ secrets.WILD_PAGE_TOKEN }}
          WILD_GEMINI_API_KEY: ${{ secrets.WILD_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.WILD_GEMINI_API_KEY }}   # sirf is page ki apni key - purani shared key nahi
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          GROQ_API_KEY: ${{ secrets.WILD_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.WILD_PIXABAY_API_KEY || secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.WILD_PEXELS_API_KEY || secrets.PEXELS_API_KEY }}
          AGENT: wild
          HD_SRC: '1'
          VIDEO_CRF: '18'
          MODE: ${{ env.S && (env.S == '52 10 * * *' || env.S == '52 16 * * *') && 'pic' || env.S && (env.S == '47 20 * * *' && 'long' || 'reel') || inputs.mode || 'reel' }}
          POST_AT: ${{ env.S == '52 10 * * *' && '11:07' || env.S == '52 16 * * *' && '17:07' || env.S == '7 12 * * *' && '13:37' || env.S == '37 18 * * *' && '20:07' || env.S == '47 20 * * *' && '23:47' || '' }}
          DRY_RUN: ${{ (!env.S && github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: |
          if [ "$MODE" = pic ]; then P=animal_pics.py; else P=wildlife.py; fi
          python $P || { echo "Koshish 2 - doosra topic"; sleep 60; python $P; } || { echo "Koshish 3 - doosra topic"; sleep 60; python $P; }
      - name: Keep video (dry run)
        if: ${{ !inputs.sched && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: wild-video
          path: |
            final_wild.mp4
            final_wild_pic.jpg
          if-no-files-found: ignore
          retention-days: 5
      - name: Save history
        if: always()
        run: |
          FILES=$(ls wild_history.json wild_*_last_run.json wild_posts_history.json 2>/dev/null || true)
          [ -z "$FILES" ] && exit 0
          mkdir -p /tmp/keep
          for f in $FILES; do cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            git add -A $FILES
            git diff --cached --quiet && break
            git commit -q -m "Update wildlife history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
