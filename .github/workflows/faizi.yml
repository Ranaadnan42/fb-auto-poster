name: Style by Faizi (Dress Agent)
run-name: ${{ github.workflow }} [${{ inputs.sched || github.event.schedule || 'manual' }}]

on:
  schedule:
    # Waqt UTC. Rozana: 2 pic albums, 2 reels (+story), 1 long video. USA/UK/Europe + Gulf audience.
    - cron: '37 11 * * *'   # pic  - post 12:07 UTC
    - cron: '47 14 * * *'   # reel - post 15:17 UTC
    - cron: '27 18 * * *'   # pic  - post 18:57 UTC
    - cron: '17 21 * * *'   # reel - post 21:47 UTC
    - cron: '27 0 * * *'    # long - post 01:07 UTC
  workflow_dispatch:
    inputs:
      sched:
        description: 'Scheduler ke liye - khali chhor dein'
        type: string
        default: ''
      mode:
        description: 'Kya banaye'
        type: choice
        options: [reel, long, pic]
        default: reel
      dry_run:
        description: 'Sirf banaye, post na kare'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: faizi-${{ (inputs.sched || github.event.schedule) || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: g
        name: Double post check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: faizi.yml
          SCHED: ${{ inputs.sched || github.event.schedule }}
        run: python3 tools/slot_gate.py

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      S: ${{ inputs.sched || github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-noto-core && break
            echo "apt koshish $i fail"; sleep 30
          done
          pip install requests pillow "edge-tts>=7.3.0"
      - name: Run dress agent
        env:
          FAIZI_PAGE_ID: ${{ secrets.FAIZI_PAGE_ID }}
          FAIZI_PAGE_TOKEN: ${{ secrets.FAIZI_PAGE_TOKEN }}
          FAIZI_GEMINI_API_KEY: ${{ secrets.FAIZI_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.FAIZI_GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          GROQ_API_KEY: ${{ secrets.FAIZI_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          VIDEO_CRF: '18'
          MODE: ${{ env.S && (env.S == '37 11 * * *' || env.S == '27 18 * * *') && 'pic' || env.S && (env.S == '27 0 * * *' && 'long' || 'reel') || inputs.mode || 'reel' }}
          POST_AT: ${{ env.S == '37 11 * * *' && '12:07' || env.S == '47 14 * * *' && '15:17' || env.S == '27 18 * * *' && '18:57' || env.S == '17 21 * * *' && '21:47' || env.S == '27 0 * * *' && '01:07' || '' }}
          DRY_RUN: ${{ (!env.S && github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: |
          python faizi.py || { echo "Koshish 2"; sleep 60; python faizi.py; } || { echo "Koshish 3"; sleep 60; python faizi.py; }
      - name: Keep output (dry run)
        if: ${{ !inputs.sched && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: faizi-output
          path: |
            final_faizi.mp4
            final_faizi_pic.jpg
            work_faizi_*/d*.jpg
          if-no-files-found: ignore
          retention-days: 5
      - name: Save history
        if: always()
        run: |
          FILES=$(ls learn_*.json faizi_history.json faizi_*_last_run.json 2>/dev/null || true)
          [ -z "$FILES" ] && exit 0
          mkdir -p /tmp/keep
          for f in $FILES; do cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            git add -A $FILES
            git diff --cached --quiet && break
            git commit -q -m "Update faizi history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
