name: Super Manager (WhatsApp hukam)

# Adnan WhatsApp par Super Manager ko jo bhi kahe -> Supabase mein hukam qatar mein.
# Scheduler (keeper.yml, har 4 min) hukam utha kar foran yeh job chalata hai; cron (har 20 min) backup hai:
#   - "bot chalao"  -> woh workflow chala deta hai
#   - koi bhi tabdeeli (page ka bio, abhi post, content/topics/captions badlo...) -> AI agent khud kar deta hai
# aur kaam ho jane par WhatsApp par batata hai.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      cmds:
        description: 'Scheduler (keeper) ke uthaye hue hukam (JSON)'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

concurrency:
  group: manager-cmds
  cancel-in-progress: false

jobs:
  cmds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hukam uthao
        id: q
        env:
          IN_CMDS: ${{ inputs.cmds }}
        run: |
          if [ -n "$IN_CMDS" ]; then printf '%s' "$IN_CMDS" > /tmp/cmds.json
          else curl -s -m 30 "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/wa-report?cmds=1" > /tmp/cmds.json || echo '{}' > /tmp/cmds.json; fi
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/cmds.json')).get('cmds',[])))" 2>/dev/null || echo 0)
          echo "n=$N" >> $GITHUB_OUTPUT
          cat /tmp/cmds.json
      - uses: actions/checkout@v4
        if: steps.q.outputs.n != '0'
      - name: Hukam poore karo
        if: steps.q.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.AGENTS_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FUNNY_PAGE_ID: ${{ secrets.FUNNY_PAGE_ID }}
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          CINE_FB_PAGE_ID: ${{ secrets.CINE_FB_PAGE_ID }}
          CINE_FB_TOKEN: ${{ secrets.CINE_FB_TOKEN }}
          FRAMES_PAGE_ID: ${{ secrets.FRAMES_PAGE_ID }}
          FRAMES_PAGE_TOKEN: ${{ secrets.FRAMES_PAGE_TOKEN }}
          WB_PAGE_ID: ${{ secrets.WB_PAGE_ID }}
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          SCENIC_PAGE_ID: ${{ secrets.SCENIC_PAGE_ID }}
          SCENIC_PAGE_TOKEN: ${{ secrets.SCENIC_PAGE_TOKEN }}
          WAR_PAGE_ID: ${{ secrets.WAR_PAGE_ID }}
          WAR_PAGE_TOKEN: ${{ secrets.WAR_PAGE_TOKEN }}
          NEWS_PAGE_ID: ${{ secrets.NEWS_PAGE_ID }}
          NEWS_PAGE_TOKEN: ${{ secrets.NEWS_PAGE_TOKEN }}
          NEWSUR_PAGE_ID: ${{ secrets.NEWSUR_PAGE_ID }}
          NEWSUR_PAGE_TOKEN: ${{ secrets.NEWSUR_PAGE_TOKEN }}
          SPORTS_PAGE_ID: ${{ secrets.SPORTS_PAGE_ID }}
          SPORTS_PAGE_TOKEN: ${{ secrets.SPORTS_PAGE_TOKEN }}
          BIRDS_PAGE_ID: ${{ secrets.BIRDS_PAGE_ID }}
          BIRDS_PAGE_TOKEN: ${{ secrets.BIRDS_PAGE_TOKEN }}
          PETS_PAGE_ID: ${{ secrets.PETS_PAGE_ID }}
          PETS_PAGE_TOKEN: ${{ secrets.PETS_PAGE_TOKEN }}
          WILD_PAGE_ID: ${{ secrets.WILD_PAGE_ID }}
          WILD_PAGE_TOKEN: ${{ secrets.WILD_PAGE_TOKEN }}
          FAIZI_PAGE_ID: ${{ secrets.FAIZI_PAGE_ID }}
          FAIZI_PAGE_TOKEN: ${{ secrets.FAIZI_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ISLAMIC_CLIENT_ID: ${{ secrets.YT_ISLAMIC_CLIENT_ID }}
          YT_ISLAMIC_CLIENT_SECRET: ${{ secrets.YT_ISLAMIC_CLIENT_SECRET }}
          YT_ISLAMIC_REFRESH_TOKEN: ${{ secrets.YT_ISLAMIC_REFRESH_TOKEN }}
          YT_FUNNY_CLIENT_ID: ${{ secrets.YT_FUNNY_CLIENT_ID }}
          YT_FUNNY_CLIENT_SECRET: ${{ secrets.YT_FUNNY_CLIENT_SECRET }}
          YT_FUNNY_REFRESH_TOKEN: ${{ secrets.YT_FUNNY_REFRESH_TOKEN }}
          YT_FRAMES_CLIENT_ID: ${{ secrets.YT_FRAMES_CLIENT_ID }}
          YT_FRAMES_CLIENT_SECRET: ${{ secrets.YT_FRAMES_CLIENT_SECRET }}
          YT_FRAMES_REFRESH_TOKEN: ${{ secrets.YT_FRAMES_REFRESH_TOKEN }}
          YT_WORLD_CLIENT_ID: ${{ secrets.YT_WORLD_CLIENT_ID }}
          YT_WORLD_CLIENT_SECRET: ${{ secrets.YT_WORLD_CLIENT_SECRET }}
          YT_WORLD_REFRESH_TOKEN: ${{ secrets.YT_WORLD_REFRESH_TOKEN }}
          YT_MOVIE_CLIENT_ID: ${{ secrets.YT_MOVIE_CLIENT_ID }}
          YT_MOVIE_CLIENT_SECRET: ${{ secrets.YT_MOVIE_CLIENT_SECRET }}
          YT_MOVIE_REFRESH_TOKEN: ${{ secrets.YT_MOVIE_REFRESH_TOKEN }}
        run: |
          pip install -q requests pyyaml google-genai >/dev/null 2>&1 || true
          git config user.name "auto-poster"; git config user.email "auto-poster@users.noreply.github.com"
          python3 - <<'PY'
          import json, os, subprocess, requests
          API = "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/wa-report?alert=1"
          cmds = json.load(open("/tmp/cmds.json")).get("cmds", [])
          def tell(t):
              try: requests.post(API, json={"text": t[:3500]}, timeout=30)
              except Exception as e: print("tell fail", e)
          for c in cmds:
              if c.get("order"):
                  env = dict(os.environ, OWNER_ORDER=c["order"])
                  subprocess.run(["git", "pull", "-q", "--rebase", "origin", "main"])
                  p = subprocess.run(["python3", "tools/ai_agent.py"], env=env, capture_output=True, text=True, timeout=1500)
                  print(p.stdout[-4000:], p.stderr[-2000:])
                  try: rec = json.load(open("agent_record.json"))
                  except Exception: rec = {}
                  subprocess.run(["git", "checkout", "--", "agent_record.json"])
                  msg = f"Manager: aap ka hukam \"{c['order'][:120]}\"\n✅ {rec.get('summary') or 'kaam kar diya'}"
                  for a in (rec.get("actions") or [])[:6]: msg += f"\n• {a}"
                  for n in (rec.get("needs_owner") or [])[:3]: msg += f"\n⚠️ aap ki zaroorat: {n}"
                  tell(msg)
              elif c.get("wf"):
                  wf = c["wf"]
                  ok = all(ch.isalnum() or ch in "_.-" for ch in wf) and os.path.exists(f".github/workflows/{wf}")
                  r = subprocess.run(["gh", "workflow", "run", wf, "--repo", os.environ["REPO"], "--ref", "main"]) if ok else None
                  print(wf, "dispatched" if r and r.returncode == 0 else "dispatch fail")  # Adnan: masle/confirm WhatsApp par nahi, sirf poochne par
          PY
