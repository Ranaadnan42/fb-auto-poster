name: Birds and Pets - brand images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  imgs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow
      - name: Generate
        run: python tools/brand_imgs2.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add docs/brand/birds docs/brand/pets
          git commit -m "Birds and Pets brand images" || exit 0
          git pull --rebase -q && git push
