name: AutoPilot Sales Agent
# Roz: sales bot ke leads mein se (website + email wale) businesses uthata hai, har ek ki APNI website se
# reel + 2 pics banata hai, AI se check karta hai, Supabase par rakhta hai aur business ko email bhejta hai
# (autopilot function, roz 15 ki had). Repo mein kuch commit nahi hota.
on:
  schedule:
    - cron: '41 13 * * *'   # 13:41 UTC = America mein subah - email kaam ke waqt pahunche
  push:
    branches: [main]
    paths: ['ap_run.json']   # haath se chalana: {"count": 2, "test": 1}
  workflow_dispatch:
    inputs:
      count:
        description: 'Kitni demos'
        default: '15'
      test:
        description: '1 = email business ko nahi, sirf Adnan ko (test)'
        default: '0'

concurrency:
  group: autopilot-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests pillow google-genai "edge-tts>=7.3.0"
      - name: Agent
        env:
          AP_AGENT: '1'
          AP_COUNT: ${{ github.event.inputs.count || '15' }}
          AP_TEST: ${{ github.event.inputs.test || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export AP_COUNT=$(python -c "import json;print(json.load(open('ap_run.json')).get('count',2))")
            export AP_TEST=$(python -c "import json;print(json.load(open('ap_run.json')).get('test',1))")
          fi
          python biz_demo.py
