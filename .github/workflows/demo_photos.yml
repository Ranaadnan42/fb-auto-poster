name: Demo website photos (Pixabay)
# Har nayi demo website ko usi business se milti photos (coffee shop = coffee, sabzi wala = sabziyan).
# Halka kaam (1-2 minute), repo mein kuch commit nahi hota - photos Supabase Storage mein jati hain.
on:
  schedule:
    - cron: '17 * * * *'    # har ghante
  workflow_dispatch:
concurrency:
  group: demo-photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Photos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python tools/demo_photos.py
