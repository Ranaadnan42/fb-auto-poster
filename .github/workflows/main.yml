name: Daily Auto Poster

on:
  schedule:
    # Pakistan time (UTC+5):
    - cron: '17 5 * * *'    # ~10:15 subah  -> Urdu
    - cron: '17 15 * * *'   # ~8:15 raat    -> Urdu
    - cron: '17 18 * * *'   # ~11:15 raat   -> English (UK shaam / America dopehar)
  workflow_dispatch:
    inputs:
      language:
        description: 'Video ki zabaan'
        type: choice
        options: [ur, en]
        default: ur
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai edge-tts requests

      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LANGUAGE: ${{ github.event.schedule == '17 18 * * *' && 'en' || inputs.language || 'ur' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python main.py

      - name: Save topic history
        if: always()
        run: |
          if [ -n "$(git status --porcelain history.json last_run.json 2>/dev/null)" ]; then
            git config user.name "auto-poster"
            git config user.email "auto-poster@users.noreply.github.com"
            git add history.json last_run.json 2>/dev/null || git add last_run.json
            git commit -m "Update topic history and run report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
