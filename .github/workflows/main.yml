name: Daily Auto Poster

on:
  schedule:
    # Viral waqt (Pakistan time UTC+5). Roz: 1 Urdu reel, 1 Urdu lambi, 1 English reel, 1 English lambi
    # GitHub runs ghanton late hote hain, is liye run 5 ghante pehle chalta hai, video bana kar
    # POST_AT waqt tak intezar karta hai (slot_wait.py) - post theek waqt par jati hai
    - cron: '7 3 * * *'     # post 08:07 UTC = ~1:07 dopehar  -> Urdu reel (Pakistan lunch break)
    - cron: '17 11 * * *'   # post 16:17 UTC = ~9:17 raat     -> Urdu lambi video (Pakistan prime time)
    - cron: '7 13 * * *'    # post 18:07 UTC = ~11:07 raat    -> English reel (UK shaam 7 baje)
    - cron: '17 16 * * *'   # post 21:17 UTC = ~2:17 raat     -> English lambi video (UK raat 10 / America shaam 5)
  workflow_dispatch:
    inputs:
      language:
        description: 'Video ki zabaan'
        type: choice
        options: [ur, en]
        default: ur
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-poster-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai "edge-tts>=7.3.0" requests

      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ISLAMIC_CLIENT_ID: ${{ secrets.YT_ISLAMIC_CLIENT_ID }}
          YT_ISLAMIC_CLIENT_SECRET: ${{ secrets.YT_ISLAMIC_CLIENT_SECRET }}
          YT_ISLAMIC_REFRESH_TOKEN: ${{ secrets.YT_ISLAMIC_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ISLAMIC_REFRESH_TOKEN: ${{ secrets.TIKTOK_ISLAMIC_REFRESH_TOKEN }}
          LANGUAGE: ${{ (github.event.schedule == '7 13 * * *' || github.event.schedule == '17 16 * * *') && 'en' || inputs.language || 'ur' }}
          POST_AT: ${{ github.event.schedule == '7 3 * * *' && '08:07' || github.event.schedule == '17 11 * * *' && '16:17' || github.event.schedule == '7 13 * * *' && '18:07' || github.event.schedule == '17 16 * * *' && '21:17' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # har run mein ya reel ya lambi video (hath se chalayen to dono)
          POST_TYPE: ${{ (github.event.schedule == '17 11 * * *' || github.event.schedule == '17 16 * * *') && 'long' || (github.event.schedule && 'reel' || 'both') }}
        # agar kuch post hone se pehle hi fail ho (jaise awaaz service band), 3 minute baad dobara koshish
        run: |
          python main.py || {
            if grep -q '"fatal:' "last_run.json" 2>/dev/null; then
              echo "Pehli koshish fail - 3 minute baad dobara"; sleep 180; python main.py
            else
              exit 1
            fi
          }

      - name: Save topic history
        if: always()
        run: |
          FILES="history.json last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $FILES; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"; done
            git add $FILES 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "Update topic history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
