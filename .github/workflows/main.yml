name: Daily Auto Poster

on:
  schedule:
    # Pakistan time (UTC+5):
    - cron: '17 5 * * *'    # ~10:15 subah  -> Urdu
    - cron: '17 15 * * *'   # ~8:15 raat    -> Urdu
    - cron: '17 18 * * *'   # ~11:15 raat   -> English (UK shaam / America dopehar)
  workflow_dispatch:
    inputs:
      language:
        description: 'Video ki zabaan'
        type: choice
        options: [ur, en]
        default: ur
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai "edge-tts>=7.3.0" requests

      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LANGUAGE: ${{ github.event.schedule == '17 18 * * *' && 'en' || inputs.language || 'ur' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        # agar kuch post hone se pehle hi fail ho (jaise awaaz service band), 3 minute baad dobara koshish
        run: |
          python main.py || {
            if grep -q '"fatal:' "last_run.json" 2>/dev/null; then
              echo "Pehli koshish fail - 3 minute baad dobara"; sleep 180; python main.py
            else
              exit 1
            fi
          }

      - name: Save topic history
        if: always()
        run: |
          FILES="history.json last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $FILES; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"; done
            git add $FILES 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "Update topic history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
