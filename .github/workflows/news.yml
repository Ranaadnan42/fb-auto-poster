name: News Act + Sports Hubs
run-name: ${{ github.workflow }} [${{ inputs.sched || github.event.schedule || 'manual' }}]

on:
  schedule:
    # Har run dono pages (News Act + Sports Hubs) par post karta hai. Waqt UTC (Pakistan = +5)
    # Pics: 4 rozana (2 Urdu, 2 English)
    - cron: '56 1 * * *'    # pic UR   - post 02:11 UTC = 7:11 subah Pakistan
    - cron: '26 5 * * *'    # pic EN   - post 05:41 UTC = 9:41 subah Gulf / London subah
    - cron: '56 9 * * *'    # pic UR   - post 10:11 UTC = 3:11 sehpehar Pakistan
    - cron: '26 14 * * *'   # pic EN   - post 14:41 UTC = 9:41 subah New York
    - cron: '51 7 * * *'    # reel UR  - post ~08:21 UTC = 1:21 dopehar Pakistan
    - cron: '51 15 * * *'   # reel EN  - post ~16:21 UTC = 11:21 subah New York, 4:21 London
    # Reels: 6 rozana (2 Urdu Pakistan ke waqt, 4 English - America ka RPM sab se zyada)
    - cron: '51 3 * * *'    # reel_ur  - post ~04:21 UTC = 9:21 subah Pakistan
    - cron: '21 12 * * *'    # reel_en  - post ~12:51 UTC = 7:51 subah New York, 12:51 London
    - cron: '21 19 * * *'    # reel_en  - post ~19:51 UTC = 2:51 dopehar New York
    - cron: '21 23 * * *'    # reel_en  - post ~23:51 UTC = 6:51 shaam New York
    # Breaking: har 2 ghante check - bari taaza khabar (kai sources par) ho to foran pic, warna kuch nahi
    - cron: '7 0 * * *'
    - cron: '7 2 * * *'
    - cron: '7 4 * * *'
    - cron: '7 6 * * *'
    - cron: '7 8 * * *'
    - cron: '7 10 * * *'
    - cron: '7 12 * * *'
    - cron: '7 14 * * *'
    - cron: '7 16 * * *'
    - cron: '7 18 * * *'
    - cron: '7 20 * * *'
    - cron: '7 22 * * *'
    # Long video bulletin (5 khabrein): 2 rozana
    - cron: '46 14 * * *'   # long UR  - post ~15:31 UTC = 8:31 raat Pakistan
    - cron: '16 20 * * *'   # long EN  - post ~21:01 UTC = 4:01 sehpehar New York
  workflow_dispatch:
    inputs:
      sched:
        description: 'Scheduler ke liye - khali chhor dein'
        type: string
        default: ''
      mode:
        description: 'Kya banaye'
        type: choice
        options: ['pic_en', 'pic_ur', 'reel_en', 'reel_ur', 'long_en', 'long_ur', 'breaking_en', 'breaking_ur', 'match_en', 'match_ur']
        default: 'pic_en'
      pages:
        description: 'Kis page par'
        type: choice
        options: ['news,sports', 'news', 'sports']
        default: 'news,sports'
      dry_run:
        description: 'Sirf banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: news-${{ (inputs.sched || github.event.schedule) || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: g
        name: Double post check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: news.yml
          SCHED: ${{ inputs.sched || github.event.schedule }}
        run: python3 tools/slot_gate.py

  post:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pick mode
        id: m
        run: |
          case "${{ inputs.sched || github.event.schedule }}" in
            '56 1 * * *')  M=pic_ur ;;
            '26 5 * * *')  M=pic_en ;;
            '56 9 * * *')  M=pic_ur ;;
            '26 14 * * *') M=pic_en ;;
            '51 7 * * *')  M=reel_ur ;;
            '51 15 * * *') M=reel_en ;;
            '46 14 * * *') M=long_ur ;;
            '16 20 * * *') M=long_en ;;
            '51 3 * * *') M=reel_ur ;;
            '21 12 * * *') M=reel_en ;;
            '21 19 * * *') M=reel_en ;;
            '21 23 * * *') M=reel_en ;;
            '7 0 * * *') M=breaking_en ;;
            '7 2 * * *') M=breaking_ur ;;
            '7 4 * * *') M=breaking_en ;;
            '7 6 * * *') M=breaking_ur ;;
            '7 8 * * *') M=breaking_en ;;
            '7 10 * * *') M=breaking_ur ;;
            '7 12 * * *') M=breaking_en ;;
            '7 14 * * *') M=breaking_ur ;;
            '7 16 * * *') M=breaking_en ;;
            '7 18 * * *') M=breaking_en ;;
            '7 20 * * *') M=breaking_en ;;
            '7 22 * * *') M=breaking_en ;;
            *) M="${{ inputs.mode }}" ;;
          esac
          [ -z "$M" ] && M=pic_en
          echo "kind=${M%%_*}" >> $GITHUB_OUTPUT
          echo "lang=${M##*_}" >> $GITHUB_OUTPUT
          echo "Mode: $M"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests "edge-tts>=7.3.0"
      - name: Post
        env:
          NEWS_PAGE_TOKEN: ${{ secrets.NEWS_PAGE_TOKEN }}
          NEWS_PAGE_ID: ${{ secrets.NEWS_PAGE_ID }}
          SPORTS_PAGE_TOKEN: ${{ secrets.SPORTS_PAGE_TOKEN }}
          SPORTS_PAGE_ID: ${{ secrets.SPORTS_PAGE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_GEMINI_API_KEY: ${{ secrets.NEWS_GEMINI_API_KEY }}
          SPORTS_GEMINI_API_KEY: ${{ secrets.SPORTS_GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PAGES: ${{ inputs.pages || 'news,sports' }}
          LANGUAGE: ${{ steps.m.outputs.lang }}
          KIND: ${{ steps.m.outputs.kind }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          case "$KIND" in
            pic) python news.py ;;
            breaking) BREAKING=1 python news.py ;;
            match) python match_video.py ;;
            *) python news_video.py ;;
          esac
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ steps.m.outputs.kind }}-${{ steps.m.outputs.lang }}
          path: |
            work_news/*_en.jpg
            work_news/*_ur.jpg
            work_newsv_*/*_final.mp4
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          FILES="news_history.json news_video_history.json news_last_run.json news_reel_en_last_run.json news_reel_ur_last_run.json news_long_en_last_run.json news_long_ur_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Update News/Sports history"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
