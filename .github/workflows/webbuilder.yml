name: Web Builder Promo

on:
  schedule:
    # Rozana: 3 pics + 3 reels + 3 long videos - English, Urdu/Hindi, Arabic (Saudi/UAE)
    - cron: '23 10 * * *'   # pic Urdu    - 3:23pm Pakistan, 1:23pm Gulf
    - cron: '43 17 * * *'   # pic English    - 8:43pm Gulf, 6:43pm London, 1:43pm New York
    - cron: '37 13 * * *'   # reel EN  - 9:37am New York, 2:37pm London
    - cron: '7 15 * * *'    # reel UR  - 8:07pm Pakistan, 6:07pm Gulf, 8:37pm India
    - cron: '47 16 * * *'   # long UR  - 9:47pm Pakistan, 7:47pm Gulf
    - cron: '13 19 * * *'   # long EN  - 3:13pm New York, 8:13pm London
    - cron: '33 11 * * *'   # pic AR   - 2:33pm Riyadh, 3:33pm Dubai
    - cron: '27 18 * * *'   # reel AR  - 9:27pm Riyadh, 10:27pm Dubai
    - cron: '3 20 * * *'    # long AR  - 11:03pm Riyadh (Gulf raat ko active)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Kya banaye'
        type: choice
        options: ['pic_en', 'pic_ur', 'pic_ar', 'reel_en', 'reel_ur', 'reel_ar', 'long_en', 'long_ur', 'long_ar']
        default: 'pic_en'
      focus:
        description: 'Pic ka promo (khali = bari bari rotate)'
        type: choice
        options: ['', 'pos', 'website', 'app', 'store']
        default: ''
      dry_run:
        description: 'Sirf banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: webbuilder-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pick mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            '37 13 * * *') M=reel_en ;;
            '7 15 * * *')  M=reel_ur ;;
            '47 16 * * *') M=long_ur ;;
            '13 19 * * *') M=long_en ;;
            '23 10 * * *') M=pic_ur ;;
            '43 17 * * *') M=pic_en ;;
            '33 11 * * *') M=pic_ar ;;
            '27 18 * * *') M=reel_ar ;;
            '3 20 * * *')  M=long_ar ;;
            '') M="${{ inputs.mode }}" ;;
            *) M=pic_en ;;
          esac
          [ -z "$M" ] && M=pic_en
          [ "$M" = "pic" ] && M=pic_en
          echo "mode=$M" >> $GITHUB_OUTPUT
          echo "kind=${M%%_*}" >> $GITHUB_OUTPUT
          echo "lang=${M##*_}" >> $GITHUB_OUTPUT
          echo "Mode: $M"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests pillow google-genai "edge-tts>=7.3.0"
      - name: Pic post
        if: steps.m.outputs.kind == 'pic'
        env:
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          WB_PAGE_ID: ${{ secrets.WB_PAGE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOCUS: ${{ inputs.focus }}
          LANGUAGE: ${{ steps.m.outputs.lang }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python webbuilder.py
      - name: Video post
        if: steps.m.outputs.kind != 'pic'
        env:
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          WB_PAGE_ID: ${{ secrets.WB_PAGE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIND: ${{ steps.m.outputs.kind }}
          LANGUAGE: ${{ steps.m.outputs.lang }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python wb_video.py
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webbuilder-${{ steps.m.outputs.mode }}
          path: |
            work_webbuilder/wb_post.jpg
            work_wbv_*/final.mp4
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          FILES="webbuilder_history.json webbuilder_en_last_run.json webbuilder_ur_last_run.json webbuilder_ar_last_run.json webbuilder_video_history.json webbuilder_video_en_reel_last_run.json webbuilder_video_ur_reel_last_run.json webbuilder_video_en_long_last_run.json webbuilder_video_ur_long_last_run.json webbuilder_video_ar_reel_last_run.json webbuilder_video_ar_long_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Update Web Builder promo history"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
