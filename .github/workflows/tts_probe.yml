name: TTS probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install "edge-tts>=7.3.0" faster-whisper
      - run: python tools/tts_probe.py
      - name: Save
        run: |
          git config user.name auto-poster; git config user.email auto-poster@users.noreply.github.com
          git add tts_test; git commit -qm "TTS probe"; git pull -q --rebase origin main; git push -q origin HEAD:main
