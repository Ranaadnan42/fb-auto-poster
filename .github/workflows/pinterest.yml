name: Pinterest Pins

on:
  schedule:
    # US/UK log Pinterest par shaam ko zyada hote hain (UTC): ~2 pins har account, din mein 2 dafa
    - cron: '41 14 * * *'
    - cron: '41 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sirf dikhaye, pin na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pinterest-bot
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pillow cryptography google-genai
      - name: Run pinterest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ISLAMIC_REFRESH_TOKEN: ${{ secrets.PINTEREST_ISLAMIC_REFRESH_TOKEN }}
          PINTEREST_LEGENDS_REFRESH_TOKEN: ${{ secrets.PINTEREST_LEGENDS_REFRESH_TOKEN }}
          PINTEREST_ATLAS_REFRESH_TOKEN: ${{ secrets.PINTEREST_ATLAS_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python pinterest.py
      - name: Save state
        if: always()
        run: |
          FILES="pinterest_state.json pinterest_tokens.json pinterest_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $FILES; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"; done
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Update Pinterest state"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
