name: Live Replies (FB comments)
run-name: Live Replies ${{ github.event.schedule || 'manual' }}

# Lagatar chalta hai: har run ~5 ghante 45 minute har minute comments dekhta hai,
# phir agla run (har 6 ghante) shuru. Repo public hai is liye GitHub minutes muft.
on:
  schedule:
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Kitne minute chale'
        default: '345'
      dry_run:
        description: 'Sirf dikhaye, jawab post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-replies
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai requests
      - name: Run live_replies.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FUNNY_PAGE_ID: ${{ secrets.FUNNY_PAGE_ID }}
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          CINE_FB_PAGE_ID: ${{ secrets.CINE_FB_PAGE_ID }}
          CINE_FB_TOKEN: ${{ secrets.CINE_FB_TOKEN }}
          FRAMES_PAGE_ID: ${{ secrets.FRAMES_PAGE_ID }}
          FRAMES_PAGE_TOKEN: ${{ secrets.FRAMES_PAGE_TOKEN }}
          WB_PAGE_ID: ${{ secrets.WB_PAGE_ID }}
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          LIVE_MINUTES: ${{ inputs.minutes || '345' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python live_replies.py
      - name: Save report
        if: always()
        run: |
          FILES="live_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Update live replies report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
