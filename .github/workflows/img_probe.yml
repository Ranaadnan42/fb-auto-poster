name: Image model probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate pillow
      - run: python tools/img_probe.py
        env:
          GEMINI_KEY_LEGENDS: ${{ secrets.GEMINI_KEY_LEGENDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Push images to probe branch
        run: |
          cd probe_out && git init -q -b probe-images && git add . && git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-images
          path: probe_out/
          if-no-files-found: ignore
