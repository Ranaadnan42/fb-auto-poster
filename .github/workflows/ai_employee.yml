name: AI Employee (agent - sab bots check + khud theek)

# Din mein 2 dafa: saare bots ka kaam dekhta hai, fail hua kaam khud dobara chalata hai,
# phir Supabase wala AI employee (database: leads, demo websites, cron) chalata hai. Koi email nahi.
on:
  schedule:
    - cron: '23 3 * * *'    # 8:23 subah Pakistan
    - cron: '23 15 * * *'   # 8:23 raat Pakistan
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ai-employee
  cancel-in-progress: false

jobs:
  employee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check all bots and fix
        env:
          GH_TOKEN: ${{ github.token }}
          NO_RERUN: "1"
        run: python3 tools/ai_employee.py
      - name: AI agent - wajah dhoond kar khud theek kare
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
        run: |
          pip install -q requests google-genai >/dev/null 2>&1 || true
          python3 tools/ai_agent.py
      - name: Content editor - repeat content rokna, naye topics
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/content_review.py || true
      - name: Page manager - FB pages ki settings, monetization tracking, ruki posting
        env:
          GH_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FUNNY_PAGE_ID: ${{ secrets.FUNNY_PAGE_ID }}
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          CINE_FB_PAGE_ID: ${{ secrets.CINE_FB_PAGE_ID }}
          CINE_FB_TOKEN: ${{ secrets.CINE_FB_TOKEN }}
          FRAMES_PAGE_ID: ${{ secrets.FRAMES_PAGE_ID }}
          FRAMES_PAGE_TOKEN: ${{ secrets.FRAMES_PAGE_TOKEN }}
          WB_PAGE_ID: ${{ secrets.WB_PAGE_ID }}
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          SCENIC_PAGE_ID: ${{ secrets.SCENIC_PAGE_ID }}
          SCENIC_PAGE_TOKEN: ${{ secrets.SCENIC_PAGE_TOKEN }}
          WAR_PAGE_ID: ${{ secrets.WAR_PAGE_ID }}
          WAR_PAGE_TOKEN: ${{ secrets.WAR_PAGE_TOKEN }}
          NEWS_PAGE_ID: ${{ secrets.NEWS_PAGE_ID }}
          NEWS_PAGE_TOKEN: ${{ secrets.NEWS_PAGE_TOKEN }}
          NEWSUR_PAGE_ID: ${{ secrets.NEWSUR_PAGE_ID }}
          NEWSUR_PAGE_TOKEN: ${{ secrets.NEWSUR_PAGE_TOKEN }}
          SPORTS_PAGE_ID: ${{ secrets.SPORTS_PAGE_ID }}
          SPORTS_PAGE_TOKEN: ${{ secrets.SPORTS_PAGE_TOKEN }}
          BIRDS_PAGE_ID: ${{ secrets.BIRDS_PAGE_ID }}
          BIRDS_PAGE_TOKEN: ${{ secrets.BIRDS_PAGE_TOKEN }}
          PETS_PAGE_ID: ${{ secrets.PETS_PAGE_ID }}
          PETS_PAGE_TOKEN: ${{ secrets.PETS_PAGE_TOKEN }}
          WILD_PAGE_ID: ${{ secrets.WILD_PAGE_ID }}
          WILD_PAGE_TOKEN: ${{ secrets.WILD_PAGE_TOKEN }}
          FAIZI_PAGE_ID: ${{ secrets.FAIZI_PAGE_ID }}
          FAIZI_PAGE_TOKEN: ${{ secrets.FAIZI_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ISLAMIC_CLIENT_ID: ${{ secrets.YT_ISLAMIC_CLIENT_ID }}
          YT_ISLAMIC_CLIENT_SECRET: ${{ secrets.YT_ISLAMIC_CLIENT_SECRET }}
          YT_ISLAMIC_REFRESH_TOKEN: ${{ secrets.YT_ISLAMIC_REFRESH_TOKEN }}
          YT_FUNNY_CLIENT_ID: ${{ secrets.YT_FUNNY_CLIENT_ID }}
          YT_FUNNY_CLIENT_SECRET: ${{ secrets.YT_FUNNY_CLIENT_SECRET }}
          YT_FUNNY_REFRESH_TOKEN: ${{ secrets.YT_FUNNY_REFRESH_TOKEN }}
          YT_FRAMES_CLIENT_ID: ${{ secrets.YT_FRAMES_CLIENT_ID }}
          YT_FRAMES_CLIENT_SECRET: ${{ secrets.YT_FRAMES_CLIENT_SECRET }}
          YT_FRAMES_REFRESH_TOKEN: ${{ secrets.YT_FRAMES_REFRESH_TOKEN }}
          YT_WORLD_CLIENT_ID: ${{ secrets.YT_WORLD_CLIENT_ID }}
          YT_WORLD_CLIENT_SECRET: ${{ secrets.YT_WORLD_CLIENT_SECRET }}
          YT_WORLD_REFRESH_TOKEN: ${{ secrets.YT_WORLD_REFRESH_TOKEN }}
          YT_MOVIE_CLIENT_ID: ${{ secrets.YT_MOVIE_CLIENT_ID }}
          YT_MOVIE_CLIENT_SECRET: ${{ secrets.YT_MOVIE_CLIENT_SECRET }}
          YT_MOVIE_REFRESH_TOKEN: ${{ secrets.YT_MOVIE_REFRESH_TOKEN }}
        run: |
          pip install -q requests pillow >/dev/null 2>&1 || true
          python3 tools/page_manager.py || true
          python3 tools/yt_manager.py || true
          GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" timeout 900 python3 tools/match_audit.py || true
          python3 tools/weekly_tasks.py || true
      - name: Save record
        run: |
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          cp employee_github.json /tmp/emp.json; cp agent_record.json /tmp/agent.json 2>/dev/null || true; cp content_rules.json /tmp/rules.json 2>/dev/null || true; cp page_manager.json /tmp/pm.json 2>/dev/null || true; cp weekly_tasks.json /tmp/wt.json 2>/dev/null || true; cp yt_manager.json /tmp/ytm.json 2>/dev/null || true; cp match_audit.json /tmp/ma.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/emp.json employee_github.json; cp /tmp/agent.json agent_record.json 2>/dev/null || true; cp /tmp/rules.json content_rules.json 2>/dev/null || true; cp /tmp/pm.json page_manager.json 2>/dev/null || true; cp /tmp/wt.json weekly_tasks.json 2>/dev/null || true; cp /tmp/ytm.json yt_manager.json 2>/dev/null || true; cp /tmp/ma.json match_audit.json 2>/dev/null || true
            git add employee_github.json; git add agent_record.json content_rules.json page_manager.json weekly_tasks.json yt_manager.json match_audit.json 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "AI employee record"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Database side (leads, demo websites, cron)
        run: curl -s -m 170 "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/ai-employee?run=1" | head -c 2000 || true
      - name: Super Manager - naye bade masle foran WhatsApp par
        run: curl -s -m 90 "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/wa-report?watch=1" | head -c 500 || true
