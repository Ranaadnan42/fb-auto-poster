name: AI Employee (agent - sab bots check + khud theek)

# Din mein 2 dafa: saare bots ka kaam dekhta hai, fail hua kaam khud dobara chalata hai,
# phir Supabase wala AI employee (database: leads, demo websites, cron) chalata hai. Koi email nahi.
on:
  schedule:
    - cron: '23 3 * * *'    # 8:23 subah Pakistan
    - cron: '23 15 * * *'   # 8:23 raat Pakistan
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ai-employee
  cancel-in-progress: false

jobs:
  employee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check all bots and fix
        env:
          GH_TOKEN: ${{ github.token }}
          NO_RERUN: "1"
        run: python3 tools/ai_employee.py
      - name: AI agent - wajah dhoond kar khud theek kare
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q requests google-genai >/dev/null 2>&1 || true
          python3 tools/ai_agent.py
      - name: Content editor - repeat content rokna, naye topics
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/content_review.py || true
      - name: Save record
        run: |
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          cp employee_github.json /tmp/emp.json; cp agent_record.json /tmp/agent.json 2>/dev/null || true; cp content_rules.json /tmp/rules.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/emp.json employee_github.json; cp /tmp/agent.json agent_record.json 2>/dev/null || true; cp /tmp/rules.json content_rules.json 2>/dev/null || true
            git add employee_github.json; git add agent_record.json content_rules.json 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "AI employee record"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Database side (leads, demo websites, cron)
        run: curl -s -m 170 "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/ai-employee?run=1" | head -c 2000 || true
