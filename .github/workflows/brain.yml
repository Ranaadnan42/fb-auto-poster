name: Pages Agent (brain) - News, Sports, Hansi Ka Adda, Web Builder, Islamic, Frames of Life
# Roz: Facebook se views parhta hai, seekhta hai, plan (news_brain.json) khud badalta hai
on:
  schedule:
    - cron: '41 0 * * *'
    - cron: '41 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-brain
  cancel-in-progress: false

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Seekho aur plan badlo
        env:
          NEWS_PAGE_TOKEN: ${{ secrets.NEWS_PAGE_TOKEN }}
          NEWS_PAGE_ID: ${{ secrets.NEWS_PAGE_ID }}
          SPORTS_PAGE_TOKEN: ${{ secrets.SPORTS_PAGE_TOKEN }}
          SPORTS_PAGE_ID: ${{ secrets.SPORTS_PAGE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_GEMINI_API_KEY: ${{ secrets.NEWS_GEMINI_API_KEY }}
          SPORTS_GEMINI_API_KEY: ${{ secrets.SPORTS_GEMINI_API_KEY }}
        run: python brain.py
      - name: Hansi Ka Adda - seekho aur plan badlo
        if: always()
        env:
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FUNNY_GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_FUNNY || secrets.GEMINI_API_KEY }}
        run: python funny_brain.py
      - name: Web Builder - seekho aur plan badlo
        if: always()
        env:
          WB_PAGE_TOKEN: ${{ secrets.WB_PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pip install -q google-genai && python wb_brain.py
      - name: Islamic + Frames of Life - seekho aur plan badlo
        if: always()
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FRAMES_PAGE_TOKEN: ${{ secrets.FRAMES_PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pip install -q google-genai && python page_brain.py
      - name: Save plan
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          mkdir -p /tmp/keep
          for f in news_brain.json brain_report.json funny_brain.json funny_brain_report.json webbuilder_brain.json webbuilder_brain_report.json islamic_brain.json islamic_brain_report.json frames_brain.json frames_brain_report.json; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in news_brain.json brain_report.json funny_brain.json funny_brain_report.json webbuilder_brain.json webbuilder_brain_report.json islamic_brain.json islamic_brain_report.json frames_brain.json frames_brain_report.json; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" . && git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Agent: naya plan (views se seekha)"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
