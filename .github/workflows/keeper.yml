name: Scheduler (posts on time)

# Har 15 minute ek chhota scan (seconds mein khatam) - GitHub par bojh bilkul kam.
# Jis post ka waqt qareeb ho us bot ko foran chala deta hai. Har bot ka apna cron bhi backup hai.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Scheduler scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/keeper.py
