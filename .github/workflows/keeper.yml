name: Scheduler (posts on time)

# Lagatar chalta hai (har 4 min scan, ~5h40m baad khud agla run). Cron sirf backup - GitHub cron ghanton late hota hai.
# Jis post ka waqt qareeb ho us bot ko foran chala deta hai. Har bot ka apna cron bhi backup hai.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Scheduler scan
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_MIN: '340'
        run: python3 tools/keeper.py
