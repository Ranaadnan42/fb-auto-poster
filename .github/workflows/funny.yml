name: Funny Videos Poster
run-name: ${{ github.workflow }} [${{ inputs.sched || github.event.schedule || 'manual' }}]

on:
  schedule:
    # Run post se ~1-2 ghante pehle (GitHub par lamba intezar nahi - kam load)
    - cron: '8 2 * * *'    # post 08:33 UTC = ~1:30 dopehar -> reel
    - cron: '8 6 * * *'    # post 12:33 UTC = ~5:30 shaam   -> reel
    - cron: '38 8 * * *'   # post 15:33 UTC = ~8:30 raat    -> lambi video (5 min)
    - cron: '8 11 * * *'   # post 17:33 UTC = ~10:30 raat   -> reel
  workflow_dispatch:
    inputs:
      sched:
        description: 'Scheduler ke liye - khali chhor dein'
        type: string
        default: ''
      mode:
        description: 'reel ya long'
        type: choice
        options: [reel, long]
        default: reel
      format:
        description: 'auto, chat ya animal'
        type: choice
        options: [auto, chat, animal, story, ai, cartoon]
        default: auto
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: funny-poster-${{ (inputs.sched || github.event.schedule) || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: g
        name: Double post / jaldi run check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: funny.yml
          SCHED: ${{ inputs.sched || github.event.schedule }}
        run: python3 tools/slot_gate.py

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      S: ${{ inputs.sched || github.event.schedule }}
    timeout-minutes: 358
    steps:
      - name: Job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai "edge-tts>=7.3.0" requests

      - name: Run funny.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          FUNNY_PAGE_ID: ${{ secrets.FUNNY_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_FUNNY_CLIENT_ID: ${{ secrets.YT_FUNNY_CLIENT_ID }}
          YT_FUNNY_CLIENT_SECRET: ${{ secrets.YT_FUNNY_CLIENT_SECRET }}
          YT_FUNNY_REFRESH_TOKEN: ${{ secrets.YT_FUNNY_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_FUNNY_REFRESH_TOKEN: ${{ secrets.TIKTOK_FUNNY_REFRESH_TOKEN }}
          MODE: ${{ env.S && 'auto' || inputs.mode || 'auto' }}
          POST_AT: ${{ env.S == '8 2 * * *' && '08:33' || env.S == '8 6 * * *' && '12:33' || env.S == '38 8 * * *' && '15:33' || env.S == '8 11 * * *' && '17:33' || '' }}
          FORMAT: ${{ !env.S && inputs.format != 'auto' && inputs.format || '' }}
          DRY_RUN: ${{ !env.S && inputs.dry_run && '1' || '0' }}
        # agar kuch post hone se pehle hi fail ho (jaise awaaz service band), 3 minute baad dobara koshish
        run: |
          python funny.py || {
            if grep -q '"fatal:' "funny_last_run.json" 2>/dev/null; then
              echo "Pehli koshish fail - 3 minute baad dobara"; sleep 180; python funny.py
            else
              exit 1
            fi
          }

      - name: Save history
        if: always()
        run: |
          FILES="funny_history.json funny_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          [ -d sfx ] && cp -r sfx /tmp/keep/
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            [ -d /tmp/keep/sfx ] && rm -rf sfx && cp -r /tmp/keep/sfx sfx
            git add -A $FILES sfx 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "Update funny history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
