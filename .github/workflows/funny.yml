name: Funny Videos Poster

on:
  schedule:
    # Pakistan time (UTC+5)
    - cron: '33 8 * * *'    # ~1:30 dopehar -> reel
    - cron: '33 12 * * *'   # ~5:30 shaam   -> reel
    - cron: '33 15 * * *'   # ~8:30 raat    -> lambi video (5 min)
    - cron: '33 17 * * *'   # ~10:30 raat   -> reel
  workflow_dispatch:
    inputs:
      mode:
        description: 'reel ya long'
        type: choice
        options: [reel, long]
        default: reel
      format:
        description: 'auto, chat ya animal'
        type: choice
        options: [auto, chat, animal, story, ai, cartoon]
        default: auto
      dry_run:
        description: 'Sirf video banaye, post na kare'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: funny-poster
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai edge-tts requests

      - name: Run funny.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FUNNY_PAGE_TOKEN: ${{ secrets.FUNNY_PAGE_TOKEN }}
          FUNNY_PAGE_ID: ${{ secrets.FUNNY_PAGE_ID }}
          MODE: ${{ inputs.mode || 'auto' }}
          FORMAT: ${{ inputs.format != 'auto' && inputs.format || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python funny.py

      - name: Save history
        if: always()
        run: |
          FILES="funny_history.json funny_last_run.json"
          mkdir -p /tmp/keep
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          [ -d sfx ] && cp -r sfx /tmp/keep/
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $FILES; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"; done
            [ -d /tmp/keep/sfx ] && rm -rf sfx && cp -r /tmp/keep/sfx sfx
            git add -A $FILES sfx 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "Update funny history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
