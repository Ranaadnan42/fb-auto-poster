name: Cinematic AI Stories (YouTube)
run-name: ${{ github.workflow }} [${{ inputs.sched || github.event.schedule || 'manual' }}]

on:
  schedule:
    # USA/UK audience ke waqt (UTC)
    # run jaldi chalta hai: Kaggle free GPU par asli chalte AI clips bante hain, post POST_AT par hoti hai
    # GitHub schedule kabhi ghanton late / skip karta hai -> har video ke 2 run (doosra backup, dobara post nahi karta)
    - cron: '47 9 * * *'   # post 16:17 UTC = 12:17 dopehar New York -> Short (poori motion)
    - cron: '17 10 * * *'   # backup Short
    - cron: '7 15 * * *'   # post 22:07 UTC = 6:07 shaam New York    -> Lambi video (~9 min)
    - cron: '37 15 * * *'    # backup Lambi
    - cron: '47 18 * * *'   # post 01:17 UTC = 9:17 raat New York -> doosra Short
    - cron: '17 19 * * *'   # backup doosra Short
  workflow_dispatch:
    inputs:
      sched:
        description: 'Scheduler ke liye - khali chhor dein'
        type: string
        default: ''
      mode:
        description: 'short ya long'
        type: choice
        options: [short, long]
        default: short
      language:
        description: 'en (dollar audience) ya ur'
        type: choice
        options: [en, ur]
        default: en
      dry_run:
        description: 'Sirf video banaye, upload na kare'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: cinematic-poster-${{ ((inputs.sched || github.event.schedule) == '47 9 * * *' || (inputs.sched || github.event.schedule) == '17 10 * * *') && 'short' || ((inputs.sched || github.event.schedule) == '7 15 * * *' || (inputs.sched || github.event.schedule) == '37 15 * * *') && 'long' || ((inputs.sched || github.event.schedule) == '47 18 * * *' || (inputs.sched || github.event.schedule) == '17 19 * * *') && 'short2' || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: g
        name: Double post / jaldi run check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: cinematic.yml
          SCHED: ${{ inputs.sched || github.event.schedule }}
        run: python3 tools/slot_gate.py

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      S: ${{ inputs.sched || github.event.schedule }}
    timeout-minutes: 358
    steps:
      - name: Job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai "edge-tts>=7.3.0" requests numpy opencv-python-headless pillow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers diffusers accelerate "kaggle>=2.0"

      - name: Cache free AI image model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-sd-turbo-v1

      - name: Run cinematic.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CINE_FB_PAGE_ID: ${{ secrets.CINE_FB_PAGE_ID }}
          CINE_FB_TOKEN: ${{ secrets.CINE_FB_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          IS_BACKUP: ${{ (env.S == '17 10 * * *' || env.S == '37 15 * * *' || env.S == '17 19 * * *') && '1' || '0' }}
          MODE: ${{ env.S && ((env.S == '7 15 * * *' || env.S == '37 15 * * *') && 'long' || 'short') || inputs.mode || 'short' }}
          POST_AT: ${{ (env.S == '47 9 * * *' || env.S == '17 10 * * *') && '16:17' || (env.S == '7 15 * * *' || env.S == '37 15 * * *') && '22:07' || (env.S == '47 18 * * *' || env.S == '17 19 * * *') && '01:17' || '' }}
          LANGUAGE: ${{ env.S && 'en' || inputs.language || 'en' }}
          DRY_RUN: ${{ !env.S && inputs.dry_run && '1' || '0' }}
        # agar kuch post hone se pehle hi fail ho (jaise awaaz service band), 3 minute baad dobara koshish
        run: |
          python cinematic.py || {
            if grep -q '"fatal:' "cinematic_${LANGUAGE}_${MODE}_last_run.json" 2>/dev/null; then
              echo "Pehli koshish fail - 3 minute baad dobara"; sleep 180; python cinematic.py
            else
              exit 1
            fi
          }

      - name: Preview (dry run)
        if: ${{ !inputs.sched && inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/preview.sh final_cinematic.mp4 legends_${{ inputs.mode }} || true
      - name: Keep video (dry run)
        if: ${{ !inputs.sched && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-video
          path: final_cinematic.mp4
          retention-days: 3

      - name: Save history
        if: always()
        run: |
          FILES=$(ls cinematic_*_history.json cinematic_*_last_run.json 2>/dev/null | grep -v "_movie_" || true)
          [ -z "$FILES" ] && exit 0
          mkdir -p /tmp/keep
          for f in $FILES; do cp "$f" /tmp/keep/; done
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/keep_files.py /tmp/keep $FILES
            git add -A $FILES
            git diff --cached --quiet && break
            git commit -q -m "Update cinematic history and run report"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
