name: Kaggle speed test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinematic-poster
  cancel-in-progress: false
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "kaggle>=2.0"
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python tools/kaggle_fast_test.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp && git clone -q --depth 1 --branch previews "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pv
          mkdir -p pv/fasttest && rm -f pv/fasttest/* && cp $GITHUB_WORKSPACE/work_test/kclips/* pv/fasttest/ 2>/dev/null || true
          cd pv && git config user.name auto-poster && git config user.email auto-poster@users.noreply.github.com
          git add -A && git commit -q -m "fast test" && git push -q origin previews
